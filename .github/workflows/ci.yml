name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Least privilege. CI only reads the repo: it checks out, installs, and runs the
# suite. No job here comments, pushes, uploads, or publishes, so nothing needs a
# write scope and nothing needs OIDC. Publishing lives entirely in release.yml,
# which scopes id-token: write to the publish job alone.
permissions:
  contents: read

jobs:
  test:
    # Runner pinned, not `ubuntu-latest`: actions/python-versions ships NO Python
    # 3.9 build for ubuntu-26.04, and the `ubuntu-latest` label moves to Ubuntu 26
    # on 2026-10-19. Remove this pin once this repo's Python floor rises above 3.9
    # and every version in every matrix here has an ubuntu-26.04 build.
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11"]

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pandas numpy requests openpyxl

    - name: Run tests
      run: |
        PYTHONPATH=. pytest tests/ -v -m "not live"
