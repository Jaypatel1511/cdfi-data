name: Release

# Triggers on any tag that looks like a version (v0.1.8, v1.0.0, etc.)
# The verify-version job fails the entire workflow if the tag does not match
# the version declared in pyproject.toml, so a mis-tagged push never reaches PyPI.
on:
  push:
    tags:
      - 'v*'

# Least privilege by default. Without this block GITHUB_TOKEN in every job
# inherits the repository-default scopes, which on a permissive default is
# read/write across contents, issues, packages and more -- handed to
# verify-version, build and test-wheel, none of which write anything.
# The publish job below overrides this with the single elevated scope it
# genuinely needs (id-token: write, for OIDC trusted publishing); that override
# is job-scoped, so it does not widen anything else.
permissions:
  contents: read

jobs:
  # ── Step 1: Verify the git tag matches pyproject.toml ─────────────────────
  verify-version:
    name: Guard — tag must match pyproject.toml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      - name: Check tag equals pyproject.toml version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"          # e.g. v0.1.8
          TAG_VERSION="${TAG#v}"                   # e.g. 0.1.8
          PYPROJECT_VERSION=$(python -c \
            "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "Git tag       : $TAG"
          echo "Tag version   : $TAG_VERSION"
          echo "pyproject     : $PYPROJECT_VERSION"
          if [ "$TAG_VERSION" != "$PYPROJECT_VERSION" ]; then
            echo ""
            echo "ERROR: git tag '$TAG' does not match pyproject.toml version '$PYPROJECT_VERSION'."
            echo "Fix: bump pyproject.toml to $TAG_VERSION, commit,"
            echo "     delete the tag, re-tag, and push again."
            exit 1
          fi
          echo "Version guard passed: $TAG_VERSION == $PYPROJECT_VERSION"

  # ── Step 2: Build the wheel from the tagged commit ────────────────────────
  build:
    name: Build wheel
    needs: verify-version
    runs-on: ubuntu-latest
    outputs:
      wheel-filename: ${{ steps.find-wheel.outputs.wheel-filename }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.11'

      - name: Install build toolchain
        run: pip install build

      - name: Build wheel and sdist
        run: python -m build

      - name: Record wheel filename
        id: find-wheel
        run: |
          WHEEL=$(ls dist/*.whl)
          echo "wheel-filename=$WHEEL" >> "$GITHUB_OUTPUT"
          echo "Built: $WHEEL"

      # This assertion lives HERE, not in test-sdist, because `build` is the only
      # job holding both the checkout and the tarball. It is an exact set
      # comparison rather than a magic number: a `-lt N` threshold pinned to the
      # count shipping that day fails the job with "check MANIFEST.in" when
      # someone legitimately deletes or merges a test module -- blaming packaging
      # for a deliberate source change. The invariant that actually matters is
      # "the tarball contains every test module the repository has", which needs
      # no threshold.
      #
      # WHAT THIS STEP DOES NOT CERTIFY -- read this before "simplifying" the
      # pipeline down to this one count. It compares test_*.py names ONLY, and
      # setuptools' legacy sdist default ALREADY matches tests/test*.py. So on
      # a completely broken MANIFEST.in this assertion still PASSES. Measured
      # on the pre-fix tarball for this repo: 4 test modules in the checkout,
      # 4 in the sdist, green -- while tests/conftest.py and tests/__init__.py
      # were both absent, which is the exact defect that produced 30 passed /
      # 1 failed / 14 errors and the reason this pipeline exists. conftest.py
      # is not a test_*.py, so nothing here can ever see it go missing. Neither
      # can it see docs/CANONICAL_SCHEMA.md, the second omission this repo had.
      #
      # This step fires only where the suite is NESTED, because the default
      # pattern matches nothing below tests/. Verified across the sweep on
      # pre-fix tarballs: cdfi-benchmark 5/5 PASS, hmda-analyzer 8/8 PASS,
      # cdfi-data 4/4 PASS, nmtc-mapper 14/14 PASS -- only
      # nmtc-application-builder failed, at 14 of 50.
      #
      # The check actually doing the work is the required-files loop in
      # test-sdist, which asserts tests/conftest.py, tests/__init__.py,
      # docs/CANONICAL_SCHEMA.md, README.md and pyproject.toml are present in
      # the tarball. Delete that loop and keep this count, and the release gate
      # certifies nothing about the files whose absence broke 0.4.0.
      - name: Assert the sdist ships every test module in the checkout
        shell: bash
        run: |
          set -euo pipefail
          SDIST="$(ls dist/*.tar.gz)"
          # Compare on paths relative to the sdist/checkout root, so nested test
          # packages (tests/<subdir>/test_*.py) are covered too, not just the top
          # level. Tarball entries are "<name>-<version>/tests/..."; stripping the
          # first path component makes the two lists directly comparable.
          find tests -name 'test_*.py' | sed 's|^|/|' | sort > "${RUNNER_TEMP}/repo-tests.txt"
          tar tzf "${SDIST}" | sed 's|^[^/]*||' \
            | grep -E '^/tests/(.*/)?test_[^/]*\.py$' | sort > "${RUNNER_TEMP}/sdist-tests.txt"

          echo "test modules in checkout : $(wc -l < "${RUNNER_TEMP}/repo-tests.txt")"
          echo "test modules in sdist    : $(wc -l < "${RUNNER_TEMP}/sdist-tests.txt")"

          if [ ! -s "${RUNNER_TEMP}/sdist-tests.txt" ]; then
            echo "::error::sdist ships no test modules at all — MANIFEST.in matches nothing"
            exit 1
          fi

          MISSING="$(comm -23 "${RUNNER_TEMP}/repo-tests.txt" "${RUNNER_TEMP}/sdist-tests.txt")"
          if [ -n "${MISSING}" ]; then
            echo "::error::sdist is missing test modules that exist in the checkout:"
            echo "${MISSING}"
            echo "::error::Fix MANIFEST.in (recursive-include tests *.py)."
            exit 1
          fi
          echo "sdist ships every test module in the checkout"

      - name: Upload wheel artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: dist-wheel
          path: dist/
          retention-days: 7

  # ── Step 3: Install the wheel in a fresh venv and run the full test suite ─
  # Critically: pytest is invoked from the venv, NOT from the source tree.
  # This catches any discrepancy between the installed wheel and the repo code.
  test-wheel:
    name: Test wheel — Python ${{ matrix.python-version }}
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Download wheel artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: dist-wheel
          path: dist/

      - name: Install wheel into fresh venv (no source editable install)
        run: |
          python -m venv /tmp/wheel_test_venv
          /tmp/wheel_test_venv/bin/pip install --upgrade pip
          /tmp/wheel_test_venv/bin/pip install dist/*.whl "pytest>=7" pytest-cov

      - name: Confirm the installed version matches the tag
        run: |
          INSTALLED=$(/tmp/wheel_test_venv/bin/python -c \
            "import cdfidata; print(cdfidata.__version__)")
          TAG="${GITHUB_REF#refs/tags/v}"
          echo "Installed version : $INSTALLED"
          echo "Expected (tag)    : $TAG"
          if [ "$INSTALLED" != "$TAG" ]; then
            echo "ERROR: installed __version__ does not match the git tag."
            exit 1
          fi

      - name: Run test suite against installed wheel
        run: |
          /tmp/wheel_test_venv/bin/pytest tests/ \
            -m "not live" \
            -v --tb=short \
            --no-header \
            --import-mode=importlib

  # ── Step 3b: Test the built SDIST, running the suite THAT SHIPPED INSIDE IT ─
  #
  # This job exists because test-wheel cannot catch a broken sdist: it runs
  # `pytest tests/` against the git checkout, so the tarball could ship zero
  # tests and every gate would still be green. That is not hypothetical here:
  # setuptools' legacy sdist default matches only tests/test*.py, so every sdist
  # through 0.4.0 shipped without tests/conftest.py, tests/__init__.py or
  # docs/CANONICAL_SCHEMA.md. Installing the published 0.4.0 sdist and running
  # its own suite gives 30 passed / 1 failed / 14 errors. Every gate was green,
  # because no gate ever installed the sdist. A gate must consume the artifact
  # it certifies.
  #
  # Nothing in this job comes from the repository.
  test-sdist:
    name: Test sdist — Python ${{ matrix.python-version }}
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      # NOTE: deliberately NO actions/checkout. If the checkout is absent, it
      # cannot leak into the thing under test.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Download dist artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: dist-wheel
          path: dist/

      - name: Unpack the sdist, install it, and run its own suite
        shell: bash
        run: |
          set -euo pipefail
          SDIST="$(ls dist/*.tar.gz)"
          echo "sdist under test: ${SDIST}"

          WORK="${RUNNER_TEMP}/sdist-work"
          mkdir -p "${WORK}"
          tar xzf "${SDIST}" -C "${WORK}"
          SRC="$(find "${WORK}" -maxdepth 1 -mindepth 1 -type d)"
          echo "--- files the sdist actually contains ---"
          tar tzf "${SDIST}"

          # Fail with a sentence, not with 14 fixture errors. Without this the
          # suite still "runs" — it just errors at collection in a way that reads
          # like a broken test rather than broken packaging.
          #
          # docs/CANONICAL_SCHEMA.md is in this list because the shipped suite
          # READS it: test_tlr.py::test_schema_doc_matches_canonical is an
          # anti-drift guard over the canonical mapping table. Omitting it does
          # not error at collection, it produces a single confusing FAILURE, so
          # it earns an explicit named check here.
          #
          # The hint names the directive that covers the path that is actually
          # missing, ported from nmtc-application-builder. A single
          # "recursive-include tests *.py" hint sent whoever hit the
          # docs/CANONICAL_SCHEMA.md case to the wrong line in MANIFEST.in --
          # that file is shipped by `include docs/CANONICAL_SCHEMA.md`, and the
          # tests directive has nothing to do with it.
          for required in tests/conftest.py tests/__init__.py README.md pyproject.toml docs/CANONICAL_SCHEMA.md; do
            if [ ! -f "${SRC}/${required}" ]; then
              case "${required}" in
                tests/*)         HINT="recursive-include tests *.py" ;;
                docs/*)          HINT="include ${required}" ;;
                *)               HINT="include ${required}" ;;
              esac
              echo "::error::sdist is missing ${required} — check MANIFEST.in (${HINT})"
              exit 1
            fi
          done

          python -m venv "${RUNNER_TEMP}/sdist-venv"
          VPY="${RUNNER_TEMP}/sdist-venv/bin/python"
          "${VPY}" -m pip install --upgrade pip
          "${VPY}" -m pip install "${SDIST}" "pytest>=7"

          # Run from a directory containing ONLY what the sdist shipped, and NOT
          # ./cdfidata. Running from ${SRC} itself would put the unpacked source
          # tree on sys.path and silently test that instead.
          TESTDIR="${RUNNER_TEMP}/sdist-tests"
          mkdir -p "${TESTDIR}/docs"
          cp -R "${SRC}/tests" "${TESTDIR}/tests"
          cp "${SRC}/README.md" "${TESTDIR}/README.md"
          cp "${SRC}/docs/CANONICAL_SCHEMA.md" "${TESTDIR}/docs/CANONICAL_SCHEMA.md"
          # pyproject.toml comes along FROM THE TARBALL (not the repo — this job
          # still has no checkout) because it carries [tool.pytest.ini_options],
          # where the `live` marker is registered. Without it pytest finds no ini
          # file here, the registration never applies, and the run emits
          # PytestUnknownMarkWarning while still passing. That is a latent break:
          # the marker is what `-m "not live"` deselects on, so --strict-markers
          # turns the warning into a collection ERROR.
          cp "${SRC}/pyproject.toml" "${TESTDIR}/pyproject.toml"
          cd "${TESTDIR}"

          ORIGIN="$("${VPY}" -c 'import cdfidata; print(cdfidata.__file__)')"
          echo "import resolved to    : ${ORIGIN}"
          case "${ORIGIN}" in
            *"/site-packages/"*) ;;
            *) echo "::error::import cdfidata resolved to '${ORIGIN}', not the installed sdist"; exit 1 ;;
          esac

          INSTALLED="$("${VPY}" -c 'import cdfidata; print(cdfidata.__version__)')"
          EXPECTED="${GITHUB_REF_NAME#v}"
          echo "installed __version__ : ${INSTALLED}"
          echo "expected (from tag)   : ${EXPECTED}"
          if [ "${INSTALLED}" != "${EXPECTED}" ]; then
            echo "::error::Installed sdist reports '${INSTALLED}', expected '${EXPECTED}'"
            exit 1
          fi

          # --strict-markers so an unregistered marker can never pass as a mere
          # warning: if the ini file stops reaching this directory, the job fails
          # loudly instead of silently deselecting nothing.
          # --junitxml so the NEXT step can count what actually executed. The
          # module-count check alone cannot: see the note there.
          "${VPY}" -m pytest tests -m "not live" --tb=short --no-header \
            --import-mode=importlib --strict-markers \
            --junitxml="${RUNNER_TEMP}/sdist-junit.xml"

      - name: Assert the sdist suite is not silently truncated
        shell: bash
        run: |
          set -euo pipefail
          SDIST="$(ls dist/*.tar.gz)"
          SHIPPED="$(tar tzf "${SDIST}" | grep -cE '/tests/(.*/)?test_[^/]*\.py$' || true)"
          echo "test modules in sdist: ${SHIPPED}"
          # This job deliberately has NO checkout, so it cannot compare the
          # tarball against the repository — that comparison lives in `build`,
          # which holds both. What this job CAN assert with nothing but the
          # tarball is that MANIFEST.in did not match nothing at all, which is
          # the failure that would otherwise let the suite "pass" by running
          # zero tests. Deliberately not an absolute threshold.
          if [ "${SHIPPED}" -eq 0 ]; then
            echo "::error::sdist ships no test modules at all — MANIFEST.in matches nothing"
            exit 1
          fi

          # The check above counts MODULES SHIPPED. It never counts EXECUTIONS,
          # and those are different numbers: a suite where every test skips or
          # is deselected exits 0 while shipping every module it should.
          #   2 skipped in 0.00s     -> pytest exit code 0
          #   1 deselected in 0.00s  -> pytest exit code 0
          # This repo passes `-m "not live"`, so it is directly exposed: widen
          # that expression, or re-mark the suite `live`, and every test is
          # deselected while the module count stays untouched and every gate
          # stays green. That is the same vacuity class as an empty parametrize,
          # at job scale.
          #
          # FLOOR DERIVATION -- not a number picked to be safe. The rule is
          # HALF of what the suite genuinely runs today, rounded down to a
          # round number. Measured on this tarball: 42 tests executed under
          # this job's exact invocation (3 more are `live` and deselected, and
          # are correctly NOT counted toward the floor). Half is 21, so the
          # floor is 20.
          #
          # Half, deliberately: the rejected `-lt 14` threshold sat at the
          # exact count shipping that day, so deleting one test module failed
          # the job with a packaging error for a deliberate source change.
          # This one has 22 tests of headroom -- you would have to delete more
          # than half the suite before it complains, while total deselection
          # lands at 0 and trips it immediately.
          FLOOR=20
          EXECUTED="$(python - "${RUNNER_TEMP}/sdist-junit.xml" <<'PY'
          import sys, xml.etree.ElementTree as ET
          root = ET.parse(sys.argv[1]).getroot()
          suites = root.findall("testsuite") if root.tag == "testsuites" else [root]
          total = sum(int(s.get("tests", 0)) for s in suites)
          skipped = sum(int(s.get("skipped", 0)) for s in suites)
          # Deselected tests never appear in the report at all, so they are
          # absent from `total` -- which is exactly what makes this catch them.
          print(total - skipped)
          PY
          )"
          echo "tests actually executed: ${EXECUTED}  (floor ${FLOOR})"
          if [ "${EXECUTED}" -lt "${FLOOR}" ]; then
            echo "::error::the sdist suite executed only ${EXECUTED} tests, below the floor of ${FLOOR}."
            echo "::error::Shipping every test module is not the same as running them. Check for a"
            echo "::error::marker change or an -m expression that deselected the suite. If the suite"
            echo "::error::genuinely shrank by more than half, re-derive FLOOR from the new count."
            exit 1
          fi

  # ── Step 4: Publish to PyPI — only after guard + build + all tests pass ───
  publish:
    name: Publish to PyPI
    needs: [verify-version, build, test-wheel, test-sdist]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/cdfidata/
    permissions:
      id-token: write   # required for OIDC trusted publishing

    steps:
      - name: Download wheel artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: dist-wheel
          path: dist/

      - name: Publish to PyPI (trusted publishing — no API token needed)
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b  # v1.14.0
