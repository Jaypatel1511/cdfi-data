[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cdfidata"
version = "0.4.0"
description = "ETL pipeline for US Treasury CDFI Fund public datasets — TLR, CLR, and Awards data"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = [
    "pandas>=1.4.0",
    "numpy>=1.21.0",
    "requests>=2.27.0",
]

[project.optional-dependencies]
parquet = ["pyarrow>=7.0.0"]

[project.urls]
Homepage = "https://github.com/Jaypatel1511/cdfi-data"

[tool.pytest.ini_options]
markers = ["live: hits live CDFI Fund endpoints (deselect with -m 'not live')"]
# A parametrized test whose argument list comes out EMPTY is silently marked
# skipped by default, and a skip exits 0. That is the same vacuity class the
# release gates exist to close: the test reports success while asserting
# nothing. fail_at_collect turns "Empty parameter set in 'test_x'" into a
# collection ERROR, so a generator that stops finding inputs fails loudly
# instead of quietly certifying nothing.
empty_parameter_set_mark = "fail_at_collect"
